# pta_finance — example config (committed template; FAKE placeholders only).
#
# Copy this file to `config.toml` (gitignored) and fill in your real values.
# The repo is PUBLIC; your real identity and IDs live ONLY in config.toml, never here.

[organization]
name        = "Example PTA"            # PTA / booster name
school_name = "Example Elementary"
school_email = "office@example.org"

[contacts]
president       = ["president@example.org"]
treasurer       = "treasurer@example.org"
cfo             = "cfo@example.org"
account_holders = ["president@example.org", "treasurer@example.org", "cfo@example.org"]  # Phase-3 allowlist

[fiscal_year]
start_month = 1                        # 1 = January (calendar year)

[grades]
labels = ["K", "1", "2", "3", "4", "5"]

[sheets]
# Optional editable source tab for sync-budget; {fy} is replaced with the fiscal year.
# budget_tab_template = "FY{fy} - Editable Internal Budget"
spreadsheet_id           = "<google-spreadsheet-id>"
test_spreadsheet_id      = "<throwaway-test-sheet-id>"     # for `check`
drive_receipts_folder_id = "<google-drive-folder-id>"
drive_reports_folder_id  = "<private-drive-folder-id>"     # report outputs (never the repo)

[google]
service_account_file = "secrets/service-account.json"

# [receipt_mapping]                           # optional - omit for all-history mapping
# received_since = "YYYY-MM-DD"               # inclusive outer email Date-header cutoff
# [receipt_refresh]                           # optional - omit to disable preparation
# allowlist = ["uploads.example.org", ".cdn.example.org"]
# cache_dir = "reports/output/receipt-cache"  # private content-addressed source cache
# pages_dir = "reports/output/receipt-pages"  # must stay beside/below the private bundle
# tesseract_path = "C:/Program Files/Tesseract-OCR/tesseract.exe" # optional OCR suggestions
# chromium_path = "C:/Program Files/Chromium/Application/chrome.exe" # optional PDF renderer
# Supplemental reimbursement anchors/actors live in a separate gitignored JSON file, not TOML:
# uv run pta-finance update-reimbursements --anchors reports/output/reimbursement-anchors.json

# [gmail]                                    # optional - omit entirely if unused
# client_secrets_file = "secrets/gmail-client-secret.json"   # OAuth Desktop-app client
# token_file          = "secrets/gmail-token.json"           # written at first consent
# inbox_dir           = "mail_samples"                       # fetched .eml land here

# [main_reports]                             # optional - Main Report Set CFO workbook sources
# Read through a SEPARATE client limited to the spreadsheets.readonly scope; share the CFO
# workbook read-only with the service account. Legacy commands ignore this section.
# source_spreadsheet_id = "<cfo-workbook-spreadsheet-id>"
# output_dir = "reports/output/main-report-runs"   # see the rule below
# Rule: output_dir is a SUBFOLDER either of reports/output/ or of a dedicated private folder
# outside the project. end-to-end-run writes main-report-set.html and the compatibility
# copies into the folder above output_dir, which must pass the same check.
# assumptions_tab = "Assumptions"                  # our own workbook's Assumptions tab
#
# One table per source alias (lowercase ASCII slug). Every kind must be bound:
# bank, wix, paypal (transaction feeds; may repeat per account) and pnl, budget_tracker,
# category_mapping, credit_card (controls; once each). header_signature is the COMPLETE
# expected header row list, validated exactly on every capture when non-empty (pnl and
# budget_tracker may use []). tab_id (sheet gid) is optional and, when set, must match.
# coverage end dates are inclusive and need private evidence.
#
# [main_reports.sources.bank-checking]
# kind = "bank"
# tab = "Bank Checking"
# tab_id = 1001
# header_signature = [["DATE", "DESCRIPTION", "AMOUNT", "CHECK #", "STATUS", "CATEGORY",
#                      "OVERRIDE CATEGORY", "FINAL CATEGORY"]]
# coverage = [{ start = "2030-01-01", end = "2030-06-30", evidence = "statement-index-2030" }]
#
# [main_reports.sources.wix]                   # two header rows: group headings, then labels
# kind = "wix"
# tab = "Store Transactions"
# header_signature = [
#   ["Payment", "", "", "", "", "", "", "", "", "Transaction", "", "", "Order", "", ""],
#   ["Provider Payment ID", "Payment Date", "Transaction Date", "Time Zone", "Currency",
#    "Amount", "Processing Fee", "Service Fee", "Net", "Status", "Refund Amount",
#    "Payment Provider", "Order ID", "Product Name", "Quantity"],
# ]
# coverage = [{ start = "2030-01-01", end = "2030-06-30", evidence = "store-export-2030-06" }]
# [main_reports.sources.wix.columns]           # override a default label / disambiguate repeats
# transaction_status = { label = "Status", group = "Transaction" }
#
# [main_reports.sources.paypal]
# kind = "paypal"
# tab = "Processor Transactions"
# header_signature = [["Date", "Time", "TimeZone", "Name", "Type", "Status", "Currency",
#                      "Gross", "Fee", "Net", "Transaction ID", "Reference Txn ID",
#                      "Item Title", "Quantity", "Balance Impact"]]
#
# [main_reports.sources.pnl]
# kind = "pnl"
# tab = "Profit & Loss"
# header_signature = []                        # formula-driven control grid (not validated)
#
# [main_reports.sources.budget-tracker]
# kind = "budget_tracker"
# tab = "Budget Tracker"
# header_signature = []
#
# [main_reports.sources.category-mapping]
# kind = "category_mapping"
# tab = "Category Mapping"
# header_signature = [["Keyword", "Target Category"]]
#
# [main_reports.sources.credit-card]           # captured only; content or a new header = warning
# kind = "credit_card"
# tab = "Credit Card Transactions"
# header_signature = [["Date", "Description", "Amount"]]
#
# [main_reports.crosswalk]                     # versioned CFO category -> budget category map
# version = 1
# [[main_reports.crosswalk.entries]]
# source_category = "Example Fundraiser"
# targets = [{ category = "Fundraiser Income", share = "1" }]
# note = "one-to-one"

